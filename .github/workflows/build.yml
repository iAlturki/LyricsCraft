name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build the mod JAR
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: SHA-256
        run: sha256sum build/libs/lyricscraft-*.jar

      # Releases are published by hand from this JAR.
      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: LyricsCraft-${{ github.sha }}
          path: build/libs/lyricscraft-*.jar
          if-no-files-found: error
          retention-days: 30
